<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PCC Ticket Number</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --lagoon-deep:#0B4A47;
    --lagoon-mid:#1C6E67;
    --sand:#F6F1E4;
    --sand-card:#FFFFFF;
    --mango:#E8A33D;
    --mango-dark:#C97F1F;
    --hibiscus:#C4452E;
    --ink:#1F2A28;
    --ink-soft:#5B6B68;
    --line:#E1DCC9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--sand);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .lang[data-lang="ja"] ~ * body, body.lang-ja{ font-family:'Noto Sans JP','Inter',sans-serif; }
  body.lang-ko{ font-family:'Noto Sans KR','Inter',sans-serif; }

  header{
    width:100%;
    background:var(--lagoon-deep);
    color:#fff;
    padding:28px 20px 46px;
    text-align:center;
    position:relative;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(24px,4vw,34px);
    margin:0 0 6px;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    font-size:15px;
    color:#CFE6E2;
    font-weight:400;
  }
  .wave{
    position:absolute;
    left:0; right:0; bottom:-1px;
    width:100%;
    height:34px;
    display:block;
  }

  .lang-switch{
    position:absolute;
    top:18px; right:18px;
    display:flex;
    gap:6px;
    background:rgba(255,255,255,0.12);
    padding:4px;
    border-radius:999px;
  }
  .lang-switch button{
    border:none;
    background:transparent;
    color:#CFE6E2;
    font-size:13px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .lang-switch button.active{
    background:var(--mango);
    color:var(--lagoon-deep);
  }

  main{
    width:100%;
    max-width:460px;
    padding:0 20px 40px;
    margin-top:-24px;
  }

  .card{
    background:var(--sand-card);
    border-radius:18px;
    padding:28px 24px 26px;
    box-shadow:0 12px 30px rgba(11,74,71,0.14);
    border:1px solid var(--line);
  }

  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin:16px 0 6px;
  }
  label:first-of-type{ margin-top:0; }

  input[type="text"], input[type="email"]{
    width:100%;
    min-height:52px;
    padding:0 14px;
    font-size:16px;
    border:1.5px solid var(--line);
    border-radius:10px;
    color:var(--ink);
    font-family:inherit;
    background:#FCFAF3;
  }
  input:focus{
    outline:none;
    border-color:var(--lagoon-mid);
    box-shadow:0 0 0 3px rgba(28,110,103,0.15);
  }

  .email-note{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
    line-height:1.45;
    padding:10px 12px;
    background:#FBF1DD;
    border-radius:8px;
    border-left:3px solid var(--mango);
  }

  .submit-btn{
    width:100%;
    min-height:56px;
    margin-top:22px;
    background:var(--mango);
    color:var(--lagoon-deep);
    border:none;
    border-radius:12px;
    font-size:16.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .submit-btn:hover{ background:var(--mango-dark); color:#fff; }
  .submit-btn:active{ transform:scale(0.98); }
  .submit-btn:disabled{
    background:#DDD6C0;
    color:#9A9482;
    cursor:not-allowed;
  }

  .error-msg{
    margin-top:14px;
    padding:12px 14px;
    background:#FBEAE6;
    border:1px solid var(--hibiscus);
    color:var(--hibiscus);
    border-radius:10px;
    font-size:14px;
    font-weight:500;
    display:none;
  }
  .error-msg.show{ display:block; }

  /* success state */
  .success-card{ display:none; text-align:center; }
  .success-card.show{ display:block; }
  .form-card.hide{ display:none; }

  .ticket-label{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:1.2px;
  }
  .ticket-number{
    font-family:'JetBrains Mono',monospace;
    font-size:56px;
    font-weight:600;
    color:var(--lagoon-deep);
    letter-spacing:4px;
    margin:10px 0 18px;
    word-break:break-all;
  }
  .success-note{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.55;
    margin-bottom:20px;
  }
  .again-btn{
    background:transparent;
    border:1.5px solid var(--lagoon-mid);
    color:var(--lagoon-mid);
    border-radius:10px;
    padding:10px 20px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:inherit;
  }

  .loading-dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius:50%;
    background:var(--lagoon-deep);
    margin:0 2px;
    animation:pulse 1.1s infinite ease-in-out;
  }
  .loading-dot:nth-child(2){ animation-delay:.15s; }
  .loading-dot:nth-child(3){ animation-delay:.3s; }
  @keyframes pulse{ 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  footer{
    padding:18px 20px 30px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .submit-btn, .loading-dot{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="lang-switch">
    <button data-lang="en" class="active">EN</button>
    <button data-lang="ja">日本語</button>
    <button data-lang="ko">한국어</button>
  </div>
  <h1 id="t-title">Get Your Ticket Number</h1>
  <p id="t-subtitle">Enter your name and email to receive your number.</p>
  <svg class="wave" viewBox="0 0 500 34" preserveAspectRatio="none">
    <path d="M0,18 C60,34 120,2 180,14 C240,26 300,4 360,14 C420,24 460,10 500,18 L500,34 L0,34 Z" fill="#F6F1E4"></path>
  </svg>
</header>

<main>
  <div class="card form-card" id="formCard">
    <label id="t-firstName" for="firstName">First Name</label>
    <input type="text" id="firstName" autocomplete="given-name">

    <label id="t-lastName" for="lastName">Last Name</label>
    <input type="text" id="lastName" autocomplete="family-name">

    <label id="t-email" for="email">Email</label>
    <input type="email" id="email" autocomplete="email">

    <label id="t-confirmEmail" for="confirmEmail">Confirm Email</label>
    <input type="email" id="confirmEmail" autocomplete="email">

    <p class="email-note" id="t-emailNote">Please double-check your email — your ticket QR code will be sent there.</p>

    <div class="error-msg" id="errorMsg"></div>

    <button class="submit-btn" id="submitBtn"><span id="t-submit">Get My Number</span></button>
  </div>

  <div class="card success-card" id="successCard">
    <div class="ticket-label" id="t-successTitle">Your Number</div>
    <div class="ticket-number" id="ticketNumber">------</div>
    <p class="success-note" id="t-successNote">Show this number to our staff at the counter. We've also emailed it to you.</p>
    <button class="again-btn" id="againBtn"><span id="t-again">Start Over</span></button>
  </div>
</main>

<footer>Polynesian Cultural Center</footer>

<script>
// ---------------------------------------------------------------
// IMPORTANT: paste your Power Automate "When a HTTP request is
// received" URL here once the flow is published.
// The flow should return a JSON response like:
//   { "ticketNumber": "482913" }
// ---------------------------------------------------------------
const FLOW_URL = "PASTE_YOUR_POWER_AUTOMATE_URL_HERE";

const i18n = {
  en: {
    title: "Get Your Ticket Number",
    subtitle: "Enter your name and email to receive your number.",
    firstName: "First Name",
    lastName: "Last Name",
    email: "Email",
    confirmEmail: "Confirm Email",
    emailNote: "Please double-check your email — your ticket QR code will be sent there.",
    submit: "Get My Number",
    successTitle: "Your Number",
    successNote: "Show this number to our staff at the counter. We've also emailed it to you.",
    again: "Start Over",
    errorRequired: "Please fill in all fields.",
    errorEmailMismatch: "Emails don't match. Please check and try again.",
    errorGeneric: "Something went wrong. Please ask our staff for help.",
    sending: "Getting your number"
  },
  ja: {
    title: "整理番号を取得",
    subtitle: "お名前とメールアドレスをご入力ください。",
    firstName: "名",
    lastName: "姓",
    email: "メールアドレス",
    confirmEmail: "メールアドレス（確認）",
    emailNote: "QRコード付きチケットはこちらのメールに送信されます。ご確認ください。",
    submit: "番号を取得",
    successTitle: "あなたの番号",
    successNote: "カウンターでスタッフにこの番号をお見せください。メールにも送信されました。",
    again: "最初から",
    errorRequired: "すべての項目をご入力ください。",
    errorEmailMismatch: "メールアドレスが一致しません。ご確認ください。",
    errorGeneric: "エラーが発生しました。スタッフにお尋ねください。",
    sending: "番号を取得しています"
  },
  ko: {
    title: "번호표 받기",
    subtitle: "이름과 이메일을 입력해 주세요.",
    firstName: "이름",
    lastName: "성",
    email: "이메일",
    confirmEmail: "이메일 확인",
    emailNote: "QR 티켓이 이 이메일로 발송됩니다. 다시 한번 확인해 주세요.",
    submit: "번호 받기",
    successTitle: "내 번호",
    successNote: "카운터에서 직원에게 이 번호를 보여주세요. 이메일로도 발송되었습니다.",
    again: "다시 시작",
    errorRequired: "모든 항목을 입력해 주세요.",
    errorEmailMismatch: "이메일이 일치하지 않습니다. 다시 확인해 주세요.",
    errorGeneric: "오류가 발생했습니다. 직원에게 문의해 주세요.",
    sending: "번호를 받는 중"
  }
};

let currentLang = "en";

function applyLang(lang){
  currentLang = lang;
  document.body.classList.remove("lang-ja","lang-ko");
  if(lang === "ja") document.body.classList.add("lang-ja");
  if(lang === "ko") document.body.classList.add("lang-ko");

  const t = i18n[lang];
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-subtitle").textContent = t.subtitle;
  document.getElementById("t-firstName").textContent = t.firstName;
  document.getElementById("t-lastName").textContent = t.lastName;
  document.getElementById("t-email").textContent = t.email;
  document.getElementById("t-confirmEmail").textContent = t.confirmEmail;
  document.getElementById("t-emailNote").textContent = t.emailNote;
  document.getElementById("t-submit").textContent = t.submit;
  document.getElementById("t-successTitle").textContent = t.successTitle;
  document.getElementById("t-successNote").textContent = t.successNote;
  document.getElementById("t-again").textContent = t.again;

  document.querySelectorAll(".lang-switch button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.lang === lang);
  });
}

document.querySelectorAll(".lang-switch button").forEach(btn=>{
  btn.addEventListener("click", ()=> applyLang(btn.dataset.lang));
});

function showError(msg){
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("show");
}
function clearError(){
  document.getElementById("errorMsg").classList.remove("show");
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  clearError();
  const t = i18n[currentLang];

  const firstName = document.getElementById("firstName").value.trim();
  const lastName = document.getElementById("lastName").value.trim();
  const email = document.getElementById("email").value.trim();
  const confirmEmail = document.getElementById("confirmEmail").value.trim();

  if(!firstName || !lastName || !email || !confirmEmail){
    showError(t.errorRequired);
    return;
  }
  if(email.toLowerCase() !== confirmEmail.toLowerCase()){
    showError(t.errorEmailMismatch);
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.innerHTML = `${t.sending} <span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span>`;

  try{
    const res = await fetch(FLOW_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ firstName, lastName, email })
    });

    if(!res.ok) throw new Error("Request failed");

    const data = await res.json();
    const number = data.ticketNumber || data.TicketNumber || data.number;

    if(!number) throw new Error("No number returned");

    document.getElementById("ticketNumber").textContent = number;
    document.getElementById("formCard").classList.add("hide");
    document.getElementById("successCard").classList.add("show");

  } catch(err){
    showError(t.errorGeneric);
    btn.disabled = false;
    btn.innerHTML = `<span id="t-submit">${t.submit}</span>`;
  }
});

document.getElementById("againBtn").addEventListener("click", ()=>{
  document.getElementById("firstName").value = "";
  document.getElementById("lastName").value = "";
  document.getElementById("email").value = "";
  document.getElementById("confirmEmail").value = "";
  document.getElementById("successCard").classList.remove("show");
  document.getElementById("formCard").classList.remove("hide");
  const t = i18n[currentLang];
  const btn = document.getElementById("submitBtn");
  btn.disabled = false;
  btn.innerHTML = `<span id="t-submit">${t.submit}</span>`;
});
</script>

</body>
</html>
